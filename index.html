<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Israel - חנות תכשיטים</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- PapaParse Library - פענוח CSV בדפדפן -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --text-muted: #6c757d;
            --primary: #1a1a1a;
            --accent: #d4af37; /* גוון זהב יוקרתי */
            --accent-hover: #b89628;
            --border-radius: 16px;
            --shadow: 0 10px 25px rgba(0,0,0,0.05);
            --shadow-hover: 0 15px 35px rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Grid Layout */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Product Card */
        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        /* Image Container */
        .image-container {
            width: 100%;
            height: 280px;
            background-color: #f1f3f5;
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .image-container img {
            transform: scale(1.06);
        }

        /* Status Badge */
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .badge.in-stock {
            background-color: rgba(40, 167, 69, 0.85);
            color: #fff;
        }

        .badge.out-of-stock {
            background-color: rgba(108, 117, 125, 0.85);
            color: #fff;
        }

        /* Card Content */
        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .category {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .sku {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .currency {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .btn-buy {
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-buy:hover {
            background-color: var(--accent);
            transform: scale(1.03);
        }

        /* Loading & Error States */
        .status-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Silver Israel</h1>
        <p>קולקציית תכשיטי כסף יוקרתיים</p>
    </header>

    <div class="container">
        <div id="products-grid" class="products-grid">
            <div class="status-msg">טוען מוצרים מתוך קובץ ה-CSV...</div>
        </div>
    </div>

    <script>
        // בדיקת מחיר: קריאת עמודת price או הגרלה רנדומלית בין 100 ל-200
        function getPrice(val) {
            const parsed = parseFloat(val);
            if (!isNaN(parsed) && parsed > 0) {
                return parsed;
            }
            return Math.floor(Math.random() * (200 - 100 + 1)) + 100;
        }

        // שליפת קובץ ה-CSV ופענוחו
        Papa.parse('silverisrael_products.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const grid = document.getElementById('products-grid');
                grid.innerHTML = '';

                const data = results.data;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="status-msg">לא נמצאו מוצרים בקובץ ה-CSV.</div>';
                    return;
                }

                data.forEach(item => {
                    const finalPrice = getPrice(item.price);

                    // טיפול בתמונה
                    let imageUrl = item.images ? item.images.trim() : '';
                    if (imageUrl.includes(';')) {
                        imageUrl = imageUrl.split(';')[0].trim();
                    } else if (imageUrl.includes(',')) {
                        imageUrl = imageUrl.split(',')[0].trim();
                    }
                    if (!imageUrl) {
                        imageUrl = 'https://via.placeholder.com/300x300?text=אין+תמונה';
                    }

                    // קטגוריה ראשית
                    const category = item.categories ? item.categories.split(';')[0] : 'תכשיטים';

                    // בדיקת סטטוס מלאי
                    const inStock = String(item.in_stock).toLowerCase() === 'true';

                    const card = document.createElement('div');
                    card.className = 'product-card';

                    card.innerHTML = `
                        <div class="image-container">
                            <img src="${imageUrl}" alt="${item.name || 'תכשיט'}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300?text=שגיאה+בתמונה'">
                            <span class="badge ${inStock ? 'in-stock' : 'out-of-stock'}">
                                ${inStock ? 'במלאי' : 'אזל המלאי'}
                            </span>
                        </div>
                        <div class="card-body">
                            <div class="category">${category}</div>
                            <h2 class="product-title">${item.name || 'מוצר ללא שם'}</h2>
                            ${item.sku ? `<div class="sku">מק"ט: ${item.sku}</div>` : ''}
                            <div class="card-footer">
                                <div class="price-container">
                                    <span class="price">${finalPrice}</span>
                                    <span class="currency">${item.currency || '₪'}</span>
                                </div>
                                <a href="${item.url || '#'}" target="_blank" class="btn-buy">צפה במוצר</a>
                            </div>
                        </div>
                    `;

                    grid.appendChild(card);
                });
            },
            error: function(err) {
                console.error('שגיאה בטעינת קובץ ה-CSV:', err);
                document.getElementById('products-grid').innerHTML = 
                    '<div class="status-msg">אירעה שגיאה בטעינת קובץ ה-CSV (silverisrael_products.csv).</div>';
            }
        });
    </script>
</body>
</html>
